<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Sabkajobs — Grab Your Dream Job & Placement Training</title>
  <meta name="description" content="Your Career, Matched by AI. Grab top job opportunities across India with free ATS-friendly job matching & placement training on Sabkajobs.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sabkajobs.in/">
  <meta property="og:title" content="Sabkajobs — Grab Your Dream Job & Placement Training">
  <meta property="og:description" content="Your Career, Matched by AI. Grab top job opportunities across India with free ATS-friendly job matching & placement training on Sabkajobs.">
  <meta property="og:image" content="https://sabkajobs.in/logo.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://sabkajobs.in/">
  <meta name="twitter:title" content="Sabkajobs — Grab Your Dream Job & Placement Training">
  <meta name="twitter:description" content="Your Career, Matched by AI. Grab top job opportunities across India with free ATS-friendly job matching & placement training on Sabkajobs.">
  <meta name="twitter:image" content="https://sabkajobs.in/logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sabkajobs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.checkoutRazorpay = function(options, onSuccess, onFailure) {
      var config = {
        key: options.key,
        amount: options.amount,
        currency: options.currency || "INR",
        name: options.name,
        description: options.description,
        prefill: {
          name: options.prefillName || "",
          email: options.prefillEmail || "",
          contact: options.prefillContact || ""
        },
        notes: options.notes || {},
        theme: {
          color: options.themeColor || "#1E2B58"
        },
        handler: function (response) {
          if (onSuccess) {
            onSuccess(response.razorpay_payment_id);
          }
        },
        modal: {
          ondismiss: function () {
            if (onFailure) {
              onFailure("Payment cancelled by user");
            }
          }
        }
      };
      var rzp = new Razorpay(config);
      rzp.open();
    };
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
