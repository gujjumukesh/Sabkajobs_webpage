<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Openings - Sabkajobs</title>
  <link rel="canonical" href="https://sabkajobs.in/jobs" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base variables copied from landing page */
    :root {
      --primary: #10B981;
      --primary-dark: #059669;
      --secondary: #0F172A;
      --accent: #F59E0B;
      --text: #334155;
      --text-light: #64748B;
      --bg: #F8FAFC;
      --bg-white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    
    /* Header */
    header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #E2E8F0; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img { height: 40px; border-radius: 8px; }
    .nav-cta a { text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; margin-left: 12px; }
    .btn-ghost { color: var(--text); }
    .btn-ghost:hover { background: #F1F5F9; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }

    /* Main Content */
    main { max-width: 1200px; margin: 40px auto; padding: 0 24px; min-height: 70vh; }
    .page-title { font-size: 36px; color: var(--secondary); margin-bottom: 8px; font-weight: 800; }
    .page-subtitle { font-size: 16px; color: var(--text-light); margin-bottom: 40px; }

    /* Jobs Grid */
    .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    
    /* Job Card */
    .job-card { background: white; border-radius: 16px; padding: 24px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
    .job-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0,0,0,0.1); }
    .job-icon { width: 48px; height: 48px; background: #EFF6FF; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; color: #2563EB; font-size: 24px; font-weight: bold; }
    .job-title { font-size: 18px; font-weight: 700; color: var(--secondary); margin-bottom: 4px; }
    .job-company { font-size: 14px; font-weight: 600; color: #2563EB; margin-bottom: 16px; }
    .job-meta { display: flex; gap: 16px; margin-bottom: 24px; font-size: 13px; color: var(--text-light); }
    .job-meta div { display: flex; align-items: center; gap: 4px; }
    .job-meta svg { width: 16px; height: 16px; }
    .btn-apply { margin-top: auto; display: block; text-align: center; width: 100%; padding: 12px; border-radius: 8px; border: 1.5px solid var(--primary); color: var(--primary); text-decoration: none; font-weight: 600; transition: all 0.2s; }
    .btn-apply:hover { background: var(--primary); color: white; }

    /* Loader */
    .loader { text-align: center; padding: 40px; color: var(--text-light); font-weight: 500; font-size: 18px; }
    .error-msg { text-align: center; padding: 40px; color: #EF4444; font-weight: 500; }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 24px; opacity: 0; transition: opacity 0.2s; }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-content { background: white; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 32px; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal-close { position: absolute; top: 24px; right: 24px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); }
    .modal-title { font-size: 24px; font-weight: 800; color: var(--secondary); margin-bottom: 8px; }
    .modal-company { font-size: 16px; font-weight: 600; color: #2563EB; margin-bottom: 24px; }
    .modal-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #E2E8F0; }
    .meta-item { display: flex; flex-direction: column; gap: 4px; }
    .meta-label { font-size: 12px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
    .meta-val { font-size: 15px; font-weight: 600; color: var(--text); }
    .modal-desc-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--secondary); }
    .modal-desc { font-size: 15px; color: var(--text); line-height: 1.7; white-space: pre-wrap; margin-bottom: 32px; }
    .modal-apply-btn { display: block; text-align: center; width: 100%; padding: 16px; border-radius: 8px; background: var(--primary); color: white; text-decoration: none; font-weight: 600; font-size: 16px; transition: background 0.2s; }
    .modal-apply-btn:hover { background: var(--primary-dark); }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="/" class="brand">
        <img src="assets/assets/images/logo.png" alt="Sabkajobs logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\' viewBox=\'0 0 40 40\'><rect width=\'40\' height=\'40\' fill=\'%2310B981\'/><text x=\'20\' y=\'20\' fill=\'white\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'sans-serif\' font-size=\'16\' font-weight=\'bold\'>SJ</text></svg>'">
      </a>
      <div class="nav-cta">
        <a class="btn btn-ghost" href="/login">Open Portal</a>
      </div>
    </div>
  </header>

  <main>
    <h1 class="page-title">Latest Opportunities</h1>
    <p class="page-subtitle">Find and apply to the best jobs matching your skills.</p>
    
    <div id="loader" class="loader">Loading latest jobs...</div>
    <div id="error" class="error-msg" style="display: none;">
      <p style="margin-bottom: 12px;">Network error. Unable to load jobs at this time.</p>
      <button onclick="loadJobs()" class="btn-primary" style="padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 15px; font-family: inherit;">Try Again</button>
    </div>
    <div id="jobs-container" class="jobs-grid"></div>
  </main>

  <div id="job-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('jobs-container');
    const loader = document.getElementById('loader');
    const errorDiv = document.getElementById('error');
    const modal = document.getElementById('job-modal');
    const modalBody = document.getElementById('modal-body');

    let allJobs = [];

    function openModal(index, skipPushState = false) {
      const job = allJobs[index];
      modalBody.innerHTML = `
        <div class="modal-title">${job.title}</div>
        <div class="modal-company">${job.company}</div>
        <div class="modal-meta-grid">
          <div class="meta-item"><span class="meta-label">Location</span><span class="meta-val">${job.location}</span></div>
          <div class="meta-item"><span class="meta-label">Salary Range</span><span class="meta-val">${job.salary}</span></div>
          <div class="meta-item"><span class="meta-label">Experience</span><span class="meta-val">${job.experience}</span></div>
          <div class="meta-item"><span class="meta-label">Skills</span><span class="meta-val">${job.skills}</span></div>
          <div class="meta-item"><span class="meta-label">Last Date to Apply</span><span class="meta-val" style="color: #EF4444">${job.lastDateToApply}</span></div>
        </div>
        <div class="modal-desc-title">Job Description</div>
        <div class="modal-desc">${job.description}</div>
        <div style="display: flex; gap: 16px;">
          <a href="/login" class="modal-apply-btn" style="flex: 1;">Login to Apply</a>
          <button onclick="shareJob('${job.slug}', '${job.title}', '${job.location}')" class="modal-apply-btn" style="flex: 1; background: #3B82F6; border: none; cursor: pointer;">Share</button>
        </div>
      `;
      modal.classList.add('active');
      
      if (!skipPushState) {
        window.history.pushState({ modalOpen: true }, '', '/jobs/' + job.slug);
      }
    }

    function closeModal() {
      modal.classList.remove('active');
      if (window.location.pathname.startsWith('/jobs/')) {
        window.history.pushState(null, '', '/jobs');
      }
    }

    function shareJob(slug, title, location) {
      const url = window.location.origin + '/jobs/' + slug;
      const text = 'Check out this job on SabkaJobs:\n' + title + ' in ' + location;
      
      if (navigator.share) {
        navigator.share({
          title: 'SabkaJobs',
          text: text,
          url: url
        }).catch(err => console.error('Share failed', err));
      } else {
        navigator.clipboard.writeText(text + '\n\n' + url)
          .then(() => alert('Job link copied to clipboard!'))
          .catch(err => console.error('Copy failed', err));
      }
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        closeModal();
      }
    }

    window.addEventListener('popstate', (event) => {
      if (window.location.pathname === '/jobs') {
        modal.classList.remove('active');
      } else if (window.location.pathname.startsWith('/jobs/')) {
        const slug = window.location.pathname.split('/').pop();
        const targetJobIndex = allJobs.findIndex(j => j.slug === slug);
        if (targetJobIndex !== -1) {
          openModal(targetJobIndex, true);
        }
      }
    });

    // Use native fetch to Firestore REST API to ensure Googlebot compatibility
    const firestoreUrl = "https://firestore.googleapis.com/v1/projects/sabkajobs-training-app-659be/databases/(default)/documents/jobs";

    function loadJobs() {
      loader.style.display = 'block';
      errorDiv.style.display = 'none';
      container.innerHTML = '';
      allJobs = [];

      fetch(firestoreUrl)
        .then(response => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then(data => {
          loader.style.display = 'none';
          
          if (!data.documents || data.documents.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748B;">No job openings available right now. Please check back later!</p>';
            return;
          }

          // Sort by createdAt descending
          let docs = data.documents;
          docs.sort((a, b) => {
            const dateA = new Date(a.fields.createdAt?.timestampValue || 0);
            const dateB = new Date(b.fields.createdAt?.timestampValue || 0);
            return dateB - dateA;
          });
          
          let index = 0;
          docs.forEach((doc) => {
            const fields = doc.fields || {};
            const title = fields.title?.stringValue || 'Unknown Title';
            const company = fields.company?.stringValue || 'Unknown Company';
            const location = fields.location?.stringValue || 'Not specified';
            const salary = fields.salary?.stringValue || 'Not specified';
            const experience = fields.experience?.stringValue || 'Not specified';
            const skills = fields.skills?.stringValue || 'Not specified';
            const lastDateToApply = fields.lastDateToApply?.stringValue || 'Not specified';
            const description = fields.description?.stringValue || 'No description provided.';
            const datePosted = fields.createdAt?.timestampValue || new Date().toISOString();
            
            const slugTitle = title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const slugLocation = location.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const slug = `${slugTitle}-${slugLocation}-${doc.name.split('/').pop()}`;

            allJobs.push({
              title, company, location, salary, experience, skills, lastDateToApply, description, slug
            });

            // Job schema injection has been removed from here. 
            // Google Jobs guidelines strictly forbid JobPosting schema on list pages.
            // The single-job schema is now correctly handled server-side by seoApi.
            
            const card = document.createElement('div');
            card.className = 'job-card';
            card.style.position = 'relative';
            card.innerHTML = `
              <button onclick="shareJob('${slug}', '${title.replace(/'/g, "\\'")}', '${location.replace(/'/g, "\\'")}')" style="position: absolute; top: 16px; right: 16px; background: none; border: none; cursor: pointer; color: #64748B; padding: 8px;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
              </button>
              <div class="job-icon">${title.charAt(0).toUpperCase()}</div>
              <div class="job-title">${title}</div>
              <div class="job-company">${company}</div>
              <div class="job-meta">
                <div>
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  ${location}
                </div>
                <div>
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  ${salary}
                </div>
              </div>
              <button onclick="openModal(${index})" class="btn-apply" style="cursor: pointer; background: none;">View Details</button>
            `;
            container.appendChild(card);
            index++;
          });

          // Handle deep link on initial load
          if (window.location.pathname.startsWith('/jobs/')) {
            const pathSlug = window.location.pathname.split('/').pop();
            const targetIndex = allJobs.findIndex(j => j.slug === pathSlug);
            if (targetIndex !== -1) {
              openModal(targetIndex, true);
            }
          }
        })
        .catch((error) => {
          console.error("Error fetching jobs: ", error);
          loader.style.display = 'none';
          errorDiv.style.display = 'block';
        });
    }

    // Initial load
    loadJobs();
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
